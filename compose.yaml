services:
  mongo:
    image: mongo:7.0
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --eval ''try { quit(rs.status().ok ? 0 : 1) } catch(e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}); quit(1) }''',
        ]
      interval: 5s
      timeout: 10s
      retries: 30
  app:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8099
      MONGODB_URI: mongodb://mongo:27017/group41?replicaSet=rs0
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin41}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      API_AUTH_REQUIRED: ${API_AUTH_REQUIRED:-false}
    ports:
      - '127.0.0.1:8099:8099'
volumes:
  mongo-data:
